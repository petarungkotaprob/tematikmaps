<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peta Tematik - Memuat...</title>
    <script>
        // Check session before redirecting
        try {
            var user = localStorage.getItem('silisa_user');
            if (user) {
                window.location.replace('dashboard.html');
            } else {
                window.location.replace('login.html');
            }
        } catch (e) {
            window.location.replace('dashboard.html');
        }
    </script>
    <!-- Theme toggle (early load) -->
    <script src="js/theme.js"></script>
</head>
<body style="font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #f8f9fa;">
    <p style="color: #5f6368;">Memuat Peta Tematik...</p>
</body>
</html>
