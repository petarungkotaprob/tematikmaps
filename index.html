<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peta Tematik - Memuat...</title>
    <script>
        // Arahkan ke dashboard hanya jika sesi masih valid.
        (function () {
            try {
                var raw = localStorage.getItem('silisa_user');
                if (!raw) {
                    window.location.replace('login.html');
                    return;
                }

                var user = JSON.parse(raw);
                var expiresAt = Number(user && user.expires_at);
                var invalid = !user ||
                    user.id === undefined || user.id === null || user.id === '' ||
                    !user.username ||
                    (isFinite(expiresAt) && expiresAt > 0 && expiresAt <= Date.now());

                if (invalid) {
                    localStorage.removeItem('silisa_user');
                    window.location.replace('login.html');
                    return;
                }

                window.location.replace('dashboard.html');
            } catch (e) {
                try { localStorage.removeItem('silisa_user'); } catch (err) {}
                window.location.replace('login.html');
            }
        })();
    </script>
    <!-- Theme toggle (early load) -->
    <script src="js/theme.js"></script>
</head>
<body style="font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #f8f9fa;">
    <p style="color: #5f6368;">Memuat Peta Tematik...</p>
</body>
</html>
