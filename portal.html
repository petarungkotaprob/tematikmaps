<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Layanan Publik - Peta Tematik</title>
    <link rel="icon" type="image/png" href="images/favicon.png">
<link rel="apple-touch-icon" href="images/pwa-192.png">
<meta name="apple-mobile-web-app-title" content="Peta Tematik">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#070e1c">
    <script src="https://unpkg.com/feather-icons"></script>
    <script src="js/pwa.js"></script>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Forms Layout */
        .report-grid {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 2rem;
        }
        #mini-map {
            width: 100%;
            height: 450px;
            border-radius: 12px;
            margin-top: 10px;
            border: 1px solid var(--glass-border);
        }

        /* --- Responsive Mobile Layout Fixes --- */
        @media (max-width: 992px) {
            .main-content {
                width: 95vw !important;
                padding: 1rem 0.5rem !important;
            }
            .report-grid {
                grid-template-columns: 1fr !important;
                gap: 1.5rem !important;
            }
            .brand-motto {
                display: none !important;
            }
        }
        @media (max-width: 768px) {
            .navbar {
                flex-direction: column !important;
                align-items: stretch !important;
                padding: 0.75rem 1rem !important;
                gap: 0.75rem !important;
            }
            .brand {
                justify-content: space-between !important;
                width: 100% !important;
            }
            .nav-links {
                display: flex !important;
                overflow-x: auto !important;
                white-space: nowrap !important;
                padding-bottom: 6px !important;
                gap: 0.5rem !important;
                align-items: center !important;
            }
            .form-row[style*="display: flex"],
            .form-row {
                flex-direction: column !important;
                gap: 0.75rem !important;
            }
            .form-row > * {
                width: 100% !important;
            }
            #mini-map {
                height: 350px !important;
                aspect-ratio: auto !important;
            }
        }

        /* --- Landscape Phone Layout Fixes --- */
        @media (max-height: 500px) {
            .navbar {
                flex-direction: row !important;
                justify-content: space-between !important;
                align-items: center !important;
                padding: 0.5rem 1rem !important;
                gap: 0 !important;
            }
            .brand {
                width: auto !important;
            }
            .brand-motto {
                display: none !important;
            }
            .nav-links {
                padding-bottom: 0 !important;
                margin: 0 !important;
            }
            .main-content {
                width: 95vw !important;
                max-width: 100% !important;
                padding: 1rem 0.5rem !important;
                margin-top: 0 !important;
            }
            .glass-panel {
                padding: 1.5rem 1rem !important;
            }
            .report-grid {
                grid-template-columns: 1fr !important;
                gap: 1.5rem !important;
            }
            .form-row[style*="display: flex"],
            .form-row {
                flex-direction: column !important;
                gap: 0.75rem !important;
            }
            .form-row > * {
                width: 100% !important;
            }
        }
    </style>
    <link rel="stylesheet" href="css/mobile.css">
</head>
<body class="portal-page" style="min-height: 100vh;">

    <nav class="navbar">
        <a href="index.html" class="brand">
            <img src="images/logo.png" alt="Peta Tematik Logo" style="height: 40px; border-radius: 4px;">
            Peta<span>Tematik</span>
            <div class="brand-motto" style="display: inline-block;">Peta Tematik Kantor Pertanahan Kota Probolinggo</div>
        </a>
        <div class="nav-links" style="display: flex; align-items: center; gap: 1rem;">

            <button id="themeToggle" class="btn" style="background: rgba(255,255,255,0.1); color: inherit; padding: 0.5rem 1rem; border-radius: 8px;">
                <i data-feather="sun" id="themeIcon"></i>
            </button>
        </div>
    </nav>

    <main class="main-content" style="display: block; width: 70vw; margin: 0 auto; height: auto; overflow: visible !important; min-height: calc(100vh - 100px);">

        <!-- FORMULIR PENDAFTARAN LAHAN -->
        <div id="tab-input" class="glass-panel">
            <h2 style="margin-bottom: 1.5rem;">Formulir Pendaftaran Lahan</h2>
            <form id="reportForm" class="report-grid">
                <div>
                    <div class="form-row" style="display: flex; gap: 1rem; margin-bottom: 0.8rem;">
                        <input type="text" id="no_permohonan" class="form-control" readonly placeholder="Otomatis Digenerate" style="background: rgba(255,255,255,0.02);">
                        <input type="text" id="nik" class="form-control" maxlength="16" pattern="\d{16}" placeholder="NIK Pemohon (16 Digit)" required>
                    </div>

                    <div class="form-row" style="display: flex; gap: 1rem; margin-bottom: 0.8rem;">
                        <input type="text" id="nama_pemohon" class="form-control" placeholder="Nama Pemohon Sesuai KTP" required>
                        <input type="text" id="nama_kuasa" class="form-control" placeholder="Nama Kuasa (Jika Ada)">
                    </div>

                    <div class="form-row" style="display: flex; gap: 1rem; margin-bottom: 0.8rem;">
                        <input type="text" id="no_telp" class="form-control" placeholder="No. Telp / HP Pemohon" required>
                    </div>

                    <div style="margin-bottom: 0.8rem;">
                        <textarea id="alamat" class="form-control" rows="2" placeholder="Alamat Domisili Lengkap" required></textarea>
                    </div>

                    <div class="form-row" style="display: flex; gap: 1rem; margin-bottom: 0.8rem;">
                        <select id="jenis_hak" class="form-control" required>
                            <option value="">-- Pilih Hak --</option>
                            <option value="Milik">Milik (SHM)</option>
                            <option value="Guna Bangunan">Guna Bangunan (SHGB)</option>
                            <option value="Pakai">Pakai</option>
                        </select>
                        <input type="text" id="nomor_hak" class="form-control" placeholder="Nomor Sertipikat" required>
                    </div>

                    <div class="form-row" style="display: flex; gap: 1rem; margin-bottom: 0.8rem;">
                        <input type="text" id="luas_sertipikat" class="form-control" placeholder="Luas Sertipikat (mÂ²)" required>
                        <input type="text" id="keadaan_tanah" class="form-control" placeholder="Keadaan Tanah Saat Ini" required>
                    </div>

                    <div class="form-row" style="display: flex; gap: 1rem; margin-bottom: 0.8rem;">
                        <select id="kecamatan" class="form-control" required>
                            <option value="">-- Pilih Kecamatan --</option>
                            <option value="Kademangan">Kademangan</option>
                            <option value="Kanigaran">Kanigaran</option>
                            <option value="Kedopok">Kedopok</option>
                            <option value="Mayangan">Mayangan</option>
                            <option value="Wonoasih">Wonoasih</option>
                        </select>
                        <select id="kelurahan" class="form-control" required disabled>
                            <option value="">-- Kelurahan --</option>
                        </select>
                    </div>

                    <div style="margin-bottom: 1.5rem;">
                        <textarea id="keperluan" class="form-control" rows="2" placeholder="Keperluan Pendaftaran..." required></textarea>
                    </div>

                    <button type="submit" id="btnSubmitForm" class="btn btn-primary" style="width: 100%;">Daftarkan Lahan</button>
                    <div id="formMsg" style="margin-top: 10px; color: #22c55e; display: none; text-align: center;">Permohonan berhasil disimpan!</div>
                </div>

                <div>
                    <label>Titik Koordinat Lokasi Lahan</label>
                    <div id="mini-map"></div>
                    <div style="display: flex; gap: 10px; margin-top: 10px;">
                        <input type="text" id="latitude" class="form-control" placeholder="Latitude" readonly required>
                        <input type="text" id="longitude" class="form-control" placeholder="Longitude" readonly required>
                    </div>
                </div>
            </form>
        </div>

    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/mobile-nav.js"></script>
    <script>
        feather.replace();

        // Theme Toggle Logic
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        
        // Cek localStorage
        if (localStorage.getItem('portal_theme') === 'light') {
            document.body.classList.add('light-mode');
            themeIcon.setAttribute('data-feather', 'moon');
        } else {
            themeIcon.setAttribute('data-feather', 'sun');
        }
        feather.replace(); // re-render icons if changed

        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('light-mode');
            if (document.body.classList.contains('light-mode')) {
                localStorage.setItem('portal_theme', 'light');
                themeIcon.setAttribute('data-feather', 'moon');
            } else {
                localStorage.setItem('portal_theme', 'dark');
                themeIcon.setAttribute('data-feather', 'sun');
            }
            feather.replace();
        });

        // 1. Data Kelurahan Setup
        const dataKelurahan = {
            "Kademangan": ["Kademangan", "Ketapang", "Pilang", "Pohsangit Kidul", "Triwung Kidul", "Triwung Lor"],
            "Kanigaran": ["Curahgrinting", "Kanigaran", "Kebonsari Kulon", "Kebonsari Wetan", "Sukoharjo", "Tisnonegaran"],
            "Kedopok": ["Jrebeng Kulon", "Jrebeng Lor", "Jrebeng Wetan", "Kareng Lor", "Kedopok", "Sumber Wetan"],
            "Mayangan": ["Jati", "Mangunharjo", "Mayangan", "Sukabumi", "Wiroborang"],
            "Wonoasih": ["Jrebeng Kidul", "Kedung Asem", "Kedung Galeng", "Pakistaji", "Sumber Taman", "Wonoasih"]
        };
        const selKec = document.getElementById('kecamatan');
        const selKel = document.getElementById('kelurahan');
        selKec.addEventListener('change', function() {
            const kec = this.value;
            selKel.innerHTML = '<option value="">-- Kelurahan --</option>';
            if (kec && dataKelurahan[kec]) {
                dataKelurahan[kec].forEach(k => {
                    selKel.innerHTML += `<option value="${k}">${k}</option>`;
                });
                selKel.disabled = false;
            } else selKel.disabled = true;
        });

        // 3. Map for Input
        const mapInput = L.map('mini-map').setView([-7.7543, 113.2159], 13);
        L.tileLayer('https://{s}.google.com/vt/lyrs=s,h&x={x}&y={y}&z={z}', {
            maxZoom: 20, subdomains:['mt0','mt1','mt2','mt3']
        }).addTo(mapInput);
        let markerInput;
        mapInput.on('click', function(e) {
            const { lat, lng } = e.latlng;
            if (markerInput) markerInput.setLatLng(e.latlng);
            else markerInput = L.marker(e.latlng).addTo(mapInput);
            document.getElementById('latitude').value = lat.toFixed(8);
            document.getElementById('longitude').value = lng.toFixed(8);
        });

        // Generate ID
        async function getNextNo() {
            try {
                const res = await fetch('api/reports.php?action=get_next_no');
                const data = await res.json();
                document.getElementById('no_permohonan').value = `${data.next_no}/${new Date().getFullYear()}`;
            } catch (e) {
                document.getElementById('no_permohonan').value = `AUTO`;
            }
        }
        getNextNo();

        // 4. Submit Form Logic
        document.getElementById('reportForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnSubmitForm');
            btn.disabled = true;
            btn.innerHTML = 'Menyimpan...';

            const payload = {
                no_permohonan: document.getElementById('no_permohonan').value || 'AUTO',
                nik: document.getElementById('nik').value,
                nama_pemohon: document.getElementById('nama_pemohon').value,
                nama_kuasa: document.getElementById('nama_kuasa').value,
                no_telp: document.getElementById('no_telp').value,
                alamat: document.getElementById('alamat').value,
                jenis_hak: document.getElementById('jenis_hak').value,
                nomor_hak: document.getElementById('nomor_hak').value,
                luas_sertipikat: document.getElementById('luas_sertipikat').value,
                keadaan_tanah: document.getElementById('keadaan_tanah').value,
                kecamatan: document.getElementById('kecamatan').value,
                kelurahan: document.getElementById('kelurahan').value,
                keperluan: document.getElementById('keperluan').value,
                latitude: document.getElementById('latitude').value,
                longitude: document.getElementById('longitude').value
            };

            if(!payload.latitude || !payload.longitude) {
                alert('Tentukan titik koordinat pada peta!');
                btn.disabled = false; btn.innerHTML = 'Daftarkan Lahan'; return;
            }

            try {
                const res = await fetch('api/reports.php', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });
                const result = await res.json();
                if(result.status === 'success') {
                    const msg = document.getElementById('formMsg');
                    msg.innerHTML = `Sukses! Nomor Anda: <b>${payload.no_permohonan}</b>`;
                    msg.style.display = 'block';
                    e.target.reset();
                    if (markerInput) mapInput.removeLayer(markerInput);
                    getNextNo();
                } else alert('Gagal: ' + result.message);
            } catch(err) {
                alert('Error koneksi.');
            }
            btn.disabled = false;
            btn.innerHTML = 'Daftarkan Lahan';
        });

    </script>
</body>
</html>
