<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Login - Peta Tematik</title>
    <link rel="icon" type="image/png" href="images/favicon.png">
<link rel="apple-touch-icon" href="images/pwa-192.png">
<meta name="apple-mobile-web-app-title" content="Peta Tematik">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/mobile.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff">
    <!-- Theme toggle (early load) -->
    <script src="js/theme.js"></script>
    <script src="https://unpkg.com/feather-icons"></script>
    <script>
        if (localStorage.getItem('silisa_user')) {
            window.location.replace('dashboard.html');
        }
    </script>
    <script src="js/pwa.js"></script>
    <style>
        /* Google Sign-in style login page */
        body.login-centered {
            background: #f8f9fa;
        }

        .login-card {
            text-align: center;
        }

        .login-card .login-logo {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .login-card .login-logo img {
            height: 56px;
            width: auto;
            border-radius: 8px;
        }

        .login-card .login-logo .brand-name {
            font-size: 1.6rem;
            font-weight: 600;
            color: #202124;
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .login-card .login-logo .brand-name span {
            color: #1a73e8;
        }

        .login-card .login-subtitle {
            color: #5f6368;
            font-size: 0.88rem;
            margin-bottom: 28px;
            margin-top: 4px;
        }

        .login-divider {
            text-align: center;
            position: relative;
            margin: 20px 0;
        }

        .login-divider::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: #dadce0;
        }

        .login-footer {
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid #dadce0;
            font-size: 0.78rem;
            color: #5f6368;
            text-align: center;
        }

        /* Subtle error highlight */
        #loginError {
            background: #fce8e6;
            border: 1px solid #f5b8b5;
            border-radius: 8px;
            padding: 10px 14px;
            color: #c5221f;
            font-size: 0.85rem;
            margin-bottom: 12px;
            text-align: left;
        }

        /* Google-style input */
        .login-card .form-group label {
            font-size: 0.82rem;
            font-weight: 500;
            color: #5f6368;
            text-align: left;
            display: block;
        }

        .login-card .form-control {
            text-align: left;
            background: #f8f9fa;
        }

        .login-card .form-control:focus {
            background: #ffffff;
        }

        .login-card form {
            text-align: left;
        }

        /* Sign-in button — pill shaped */
        #btnLogin {
            border-radius: 24px;
            min-height: 48px;
            font-size: 0.95rem;
            font-weight: 500;
            letter-spacing: 0.01em;
        }
    </style>
</head>
<body class="login-centered login-page">

    <div class="login-card animated">
        <div class="login-logo">
            <img src="images/logo.png" alt="Peta Tematik Logo">
            <div class="brand-name">Peta<span>Tematik</span></div>
        </div>
        <p class="login-subtitle">Peta Tematik Kantor Pertanahan Kota Probolinggo</p>

        <form id="loginForm" style="text-align: left;" autocomplete="off">
            <div class="form-group">
                <label>Username / ID Pegawai</label>
                <input type="text" id="username" class="form-control" placeholder="Masukkan username" autocomplete="off" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <div class="password-wrap">
                    <input type="password" id="password" class="form-control" placeholder="Masukkan kata sandi" autocomplete="new-password" required>
                    <button type="button" class="password-toggle" id="togglePassword" aria-label="Tampilkan kata sandi">
                        <i data-feather="eye"></i>
                    </button>
                </div>
            </div>
            
            <div id="loginError" style="display: none;"></div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px;" id="btnLogin">
                <i data-feather="log-in" style="width: 16px; height: 16px;"></i> Masuk
            </button>
        </form>

        <div class="login-footer">
            Akses khusus untuk Admin dan Petugas Lapangan BPN.
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/mobile-nav.js"></script>
    <script src="js/site.js"></script>
    <script>
        feather.replace();

        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        if (togglePassword && passwordInput) {
            togglePassword.addEventListener('click', function () {
                const show = passwordInput.type === 'password';
                passwordInput.type = show ? 'text' : 'password';
                togglePassword.setAttribute('aria-label', show ? 'Sembunyikan kata sandi' : 'Tampilkan kata sandi');
                togglePassword.innerHTML = '<i data-feather="' + (show ? 'eye-off' : 'eye') + '"></i>';
                if (typeof feather !== 'undefined') feather.replace();
            });
        }
    </script>
</body>
</html>
