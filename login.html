<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Login - Peta Tematik</title>
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/mobile.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#070e1c">
    <script src="https://unpkg.com/feather-icons"></script>
    <script src="js/pwa.js"></script>
</head>
<body class="login-centered login-page">

    <div class="login-card animated">
        <a href="#" class="brand">
            <img src="images/logo.png" alt="Peta Tematik Logo" style="height: 60px; width: auto; border-radius: 8px; margin-bottom: 5px;">
            Peta<span>Tematik</span>
        </a>
        <p style="color: var(--text-secondary); margin-bottom: 2rem; font-size: 0.9rem;">Peta Tematik Kantor Pertanahan Kota Probolinggo</p>

        <form id="loginForm" style="text-align: left;" autocomplete="off">
            <div class="form-group">
                <label>Username / ID Pegawai</label>
                <input type="text" id="username" class="form-control" placeholder="Username" autocomplete="off" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <div class="password-wrap">
                    <input type="password" id="password" class="form-control" placeholder="Masukkan kata sandi..." autocomplete="new-password" required>
                    <button type="button" class="password-toggle" id="togglePassword" aria-label="Tampilkan kata sandi">
                        <i data-feather="eye"></i>
                    </button>
                </div>
            </div>
            
            <div id="loginError" style="color: #ef4444; font-size: 0.85rem; margin-bottom: 1rem; display: none;"></div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;" id="btnLogin">
                <i data-feather="log-in" style="width: 16px; height: 16px; margin-right: 5px; vertical-align: middle;"></i> Masuk
            </button>
        </form>

        <div style="margin-top: 2rem; font-size: 0.8rem; color: var(--text-secondary);">
            Khusus Admin dan Petugas Lapangan BPN.
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/mobile-nav.js"></script>
    <script>
        feather.replace();

        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        if (togglePassword && passwordInput) {
            togglePassword.addEventListener('click', function () {
                const show = passwordInput.type === 'password';
                passwordInput.type = show ? 'text' : 'password';
                togglePassword.setAttribute('aria-label', show ? 'Sembunyikan kata sandi' : 'Tampilkan kata sandi');
                togglePassword.innerHTML = '<i data-feather="' + (show ? 'eye-off' : 'eye') + '"></i>';
                if (typeof feather !== 'undefined') feather.replace();
            });
        }
    </script>
</body>
</html>
