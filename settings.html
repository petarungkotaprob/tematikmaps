<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Pengaturan - Peta Tematik</title>
    <link rel="icon" type="image/png" href="images/favicon.png">
<link rel="apple-touch-icon" href="images/pwa-192.png">
<meta name="apple-mobile-web-app-title" content="Peta Tematik">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/feather-icons"></script>
    <script src="js/pwa.js"></script>
    <style>
        .settings-container {
            max-width: 600px;
            margin: 0 auto;
            margin-top: 3rem;
        }
        .header-title {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 1rem;
        }
    </style>
    <link rel="stylesheet" href="css/mobile.css">
</head>
<body class="settings-page">

    <nav class="navbar">
        <a href="dashboard.html" class="brand">
            <img src="images/logo.png" alt="Peta Tematik Logo" style="height: 40px; width: auto; border-radius: 4px;">
            Peta<span>Tematik</span>
            <div class="brand-motto">Peta Tematik Kantor Pertanahan Kota Probolinggo</div>
        </a>
        <div class="nav-links">
            <a href="dashboard.html">Peta Tematik</a>
            <a href="tracker.html">Daftar Permohonan</a>
            <a href="laporan.html">Laporan</a>
            <a href="report.html">Input Lahan</a>
        </div>
    </nav>

    <main class="main-content" style="display: block; height: auto;">
        
        <div class="settings-container">
            <div class="glass-panel animated">
                
                <div class="header-title">
                    <i data-feather="settings" style="width: 24px; height: 24px; color: var(--accent-orange);"></i>
                    <h2 style="margin: 0;">Pengaturan Akun</h2>
                </div>

                <form id="settingsForm">
                    <input type="hidden" id="user_id">
                    
                    <div class="form-group">
                        <label>Hak Akses / Jabatan Internal</label>
                        <input type="text" id="role_label" class="form-control" style="background: rgba(255,255,255,0.02); color: var(--text-secondary);" disabled>
                    </div>

                    <div class="form-group">
                        <label>Username Anda</label>
                        <input type="text" id="username" class="form-control" required autocomplete="off">
                        <small style="color: var(--text-secondary); display: block; margin-top: 5px;">Gunakan username unik tanpa spasi.</small>
                    </div>

                    <div class="form-group" style="margin-top: 2rem;">
                        <label style="color: var(--accent-orange);">Ubah Kata Sandi (Opsional)</label>
                        <input type="password" id="password" class="form-control" placeholder="Biarkan kosong jika tidak ingin ganti password" autocomplete="new-password">
                    </div>

                    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1.5rem;" id="btnSave">
                        Simpan Perubahan
                    </button>
                    
                    <div id="settingsMsg" style="font-size: 0.85rem; margin-top: 1rem; text-align: center; display: none;"></div>
                </form>

                <div class="settings-actions">
                    <button type="button" class="btn" id="btnMobileTheme" style="background: rgba(234, 179, 8, 0.12); color: #eab308; border: 1px solid rgba(234, 179, 8, 0.25);">
                        <i data-feather="sun" style="width: 16px; height: 16px; margin-right: 5px; vertical-align: middle;"></i> Mode Terang
                    </button>
                    <button type="button" class="btn" id="btnMobileLogout" style="background: rgba(239, 68, 68, 0.12); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.25);">
                        <i data-feather="log-out" style="width: 16px; height: 16px; margin-right: 5px; vertical-align: middle;"></i> Keluar
                    </button>
                </div>

            </div>
        </div>

    </main>

    <script src="js/auth.js"></script>
    <script src="js/mobile-nav.js"></script>
    <script src="js/site.js"></script>
    <script>
        feather.replace();

        const btnMobileTheme = document.getElementById('btnMobileTheme');
        const btnMobileLogout = document.getElementById('btnMobileLogout');

        function renderMobileThemeButton() {
            if (!btnMobileTheme) return;
            const light = document.body.classList.contains('light-mode');
            btnMobileTheme.innerHTML = '<i data-feather="' + (light ? 'moon' : 'sun') + '" style="width: 16px; height: 16px; margin-right: 5px; vertical-align: middle;"></i> ' + (light ? 'Mode Gelap' : 'Mode Terang');
            if (typeof feather !== 'undefined') feather.replace();
        }

        document.addEventListener('DOMContentLoaded', renderMobileThemeButton);

        if (btnMobileTheme) {
            btnMobileTheme.addEventListener('click', function () {
                const nextLight = !document.body.classList.contains('light-mode');
                document.body.classList.toggle('light-mode', nextLight);
                localStorage.setItem('silisa_theme', nextLight ? 'light' : 'dark');
                renderMobileThemeButton();
            });
        }

        if (btnMobileLogout) {
            btnMobileLogout.addEventListener('click', function () {
                localStorage.removeItem('silisa_user');
                window.location.href = 'login.html';
            });
        }

        // Ambil ID dari LocalStorage (Auth.js sudah memastikan radar_user exist di protected page)
        const activeSession = JSON.parse(localStorage.getItem('silisa_user'));
        if (activeSession) {
            document.getElementById('user_id').value = activeSession.id || 0;
            document.getElementById('role_label').value = String(activeSession.role).toUpperCase();
            document.getElementById('username').value = activeSession.username;
        }

        const settingsForm = document.getElementById('settingsForm');
        settingsForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnSave');
            const msgBox = document.getElementById('settingsMsg');
            
            btn.innerHTML = 'Menyimpan...';
            btn.disabled = true;
            msgBox.style.display = 'none';

            const payload = {
                user_id: document.getElementById('user_id').value,
                new_username: document.getElementById('username').value,
                new_password: document.getElementById('password').value
            };

            try {
                const response = await fetch('api/settings.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const result = await response.json();

                if (result.status === 'success') {
                    msgBox.style.color = '#22c55e';
                    msgBox.innerText = result.message;
                    
                    // Update sesi di browser agar navbar ikut terganti
                    activeSession.username = result.new_username;
                    localStorage.setItem('silisa_user', JSON.stringify(activeSession));

                    // Kosongkan kolom password setelah selesai
                    document.getElementById('password').value = '';
                    
                    // Refresh nama di bar navigasi
                    setTimeout(() => location.reload(), 1500);

                } else {
                    throw new Error(result.message);
                }
            } catch (err) {
                msgBox.style.color = '#ef4444';
                msgBox.innerText = err.message;
                
                // Fallback offline test
                if (err.message.includes('fetch')) {
                    alert('Sesi gagal terhubung ke XAMPP API. Pengaturan disimpan secara offline (local).');
                    activeSession.username = payload.new_username;
                    localStorage.setItem('silisa_user', JSON.stringify(activeSession));
                    location.reload();
                }
            } finally {
                btn.innerHTML = 'Simpan Perubahan';
                btn.disabled = false;
                msgBox.style.display = 'block';
            }
        });
    </script>
</body>
</html>
